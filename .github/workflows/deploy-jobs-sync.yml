name: Deploy jobs-sync worker

# Deploys the careers projection worker (jobs-sync/) on push to the default branch.
# Worker secrets (WRITER_CERT_PRIVATE_KEY, REFRESH_SECRET) are set once with
# `wrangler secret put` and persist across deploys — they are NOT in CI.
on:
  push:
    branches: [main, master]
    paths:
      - 'jobs-sync/**'
      - '.github/workflows/deploy-jobs-sync.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jobs-sync/package-lock.json
      - name: Install dependencies
        working-directory: jobs-sync
        run: npm ci --ignore-scripts
      - name: Typecheck
        working-directory: jobs-sync
        run: npm run typecheck
      - name: Deploy
        working-directory: jobs-sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
