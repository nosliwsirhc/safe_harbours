name: Deploy to Cloudflare Workers

# Auto-deploy on every push to the default branch. Builds the Astro app in
# web/ and deploys it to Cloudflare Workers (static assets + the contact-form
# route) via wrangler, using the config the @astrojs/cloudflare adapter emits
# at dist/server/wrangler.json.
#
# Runtime secrets live on the Worker and persist across deploys. They are Safe
# Harbours' OWN secrets — set them on this Worker (safe-harbours-web), distinct
# from any sibling site:
#   - RESEND_TOKEN          (Safe Harbours' own Resend API key)
#   - TURNSTILE_SECRET_KEY  (Safe Harbours' own Turnstile secret)
#   - CONTACT_TO            (default info@safeharbours.ca)
#   - CONTACT_FROM          (default "Safe Harbours <noreply@safeharbours.ca>")
#
# NOTE: Astro 6 + @astrojs/cloudflare v13 dropped Cloudflare Pages support;
# the Worker is named "safe-harbours-web" (from package.json "name"). The
# CLOUDFLARE_API_TOKEN secret must have the Workers Scripts:Edit scope.
on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # --ignore-scripts skips sharp's native postinstall (not needed — the
      # build uses passthroughImageService and images are pre-generated).
      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Build
        working-directory: web
        env:
          # Public Turnstile site key — baked into the client HTML at build time.
          # It's a public value (visible in page source), but it's stored as a
          # GitHub Actions secret named PUBLIC_TURNSTILE_SITE_KEY, so read it
          # from secrets. Without it, the form uses Cloudflare's always-pass
          # TEST key.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: npm run build

      # Deploy with the project's own wrangler (a dependency of
      # @astrojs/cloudflare), so the deploy CLI matches the version that
      # generated dist/server/wrangler.json.
      - name: Deploy to Cloudflare Workers
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json
